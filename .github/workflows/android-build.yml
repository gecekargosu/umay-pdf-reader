# ╔══════════════════════════════════════════════════════════════╗
# ║  JarvisMobile — GitHub Actions Build Workflow               ║
# ║  AGP 8.1.4 | Gradle 8.0 | Kotlin 1.9.10 | compileSdk 34   ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Bu workflow JarvisMobile projesini GitHub Actions runner'ında
# derler ve debug APK'yı artifact olarak saklar.
#
# Gereksinimler (proje dosyalarından otomatik çözülür):
#   - JDK 17 (AGP 8.x gerektirir)
#   - Android SDK platform-34
#   - Android SDK build-tools-34.0.0
#
# Ne yapar:
#   1. Kodu checkout eder
#   2. JDK 17 kurar
#   3. Android SDK hazırlar
#   4. Gradle cache kullanır (hız için)
#   5. ./gradlew assembleDebug çalıştırır
#   6. Oluşan APK'yı artifact olarak yükler (7 gün saklanır)
#
# Başlatma yöntemleri:
#   - push to main/master branch
#   - manual trigger (workflow_dispatch)

name: Build JarvisMobile

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Manuel tetikleme

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─── 1. KODU CHECKOUT ET ───
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. JDK 17 KUR ───
      # AGP 8.1.4 minimum JDK 17 gerektirir.
      # Bu projede compileOptions Java 1.8 olarak ayarlı ama
      # Gradle/AGP'nin kendisi JDK 17 ile çalışmalı.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'  # Eclipse Temurin (ücretsiz, LTS)

      # ─── 3. GRADLE CACHE ───
      # Gradle bağımlılıklarını cache'ler → sonraki build'ler ~2x hızlı
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ─── 4. GRADLEW İZİN VER ───
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ─── 5. BUILD ───
      # assembleDebug: Debug APK oluşturur (imzasız, test amaçlı)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ─── 6. APK'YI BUL VE KONTROL ET ───
      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            echo ""
            echo "Build output directory contents:"
            find app/build/outputs -type f 2>/dev/null || echo "  (no outputs directory)"
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "APK size: $(ls -lh "$APK_PATH" | awk '{print $5}')"
          echo "APK sha256: $(sha256sum "$APK_PATH" | awk '{print $1}')"

      # ─── 7. APK'YI ARTIFACT OLARAK YÜKLE ───
      # 7 gün boyunca indirilebilir.
      # GitHub sayfasından: Actions → son run → Artifacts section
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvismobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # ─── 8. BUILD BAŞARISIZ OLURSA DETAYLI LOG ───
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 3
          if-no-files-found: ignore
